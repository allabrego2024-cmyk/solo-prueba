<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>compras y sumas de precio directo</title>
    <script src="https://unpkg.com/@zxing/library@0.20.0"></script>
</head>
<body>
    <style>
        body{
            background-color: black;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        .contenedor-completo{
            background:
            radial-gradient(circle at top left, rgb(53, 53, 53) 20%, transparent 60%),
            radial-gradient(circle at top right, rgb(53, 53, 53) 20%, transparent 60%),
            radial-gradient(circle at bottom left, rgba(255, 255, 255, 0.651) 10%, transparent 40%),
            radial-gradient(circle at bottom right, rgba(255, 255, 255, 0.651) 10%, transparent 40%);
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .camara-digitador{
            border: 2px solid rgb(255, 255, 255);
            width: 80%;
            height: 35%;
            position: absolute;
            top: 5%;
            left: 10%;
            border-radius: 10px;
            overflow: hidden;
            background: #222;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .resultado-escaneo{
            position: absolute;
            top: 2%;
            left: 10%;
            width: 80%;
            text-align: center;
            color: lime;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 1px 1px 3px black;
            z-index: 10;
        }

        .muestra-numero-escaneado{
            background-color: rgba(255, 255, 255, 0.9);
            border: 2px solid black;
            border-radius: 20px;
            width: 80%;
            height: 45%;
            position: absolute;
            top: 45%;
            left: 10%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 10px;
            box-sizing: border-box;
        }

        .total{
            background-color: white;
            border: 2px solid black;
            width: 90%;
            height: 25%;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .capturar-imagen{
            background-color: greenyellow;
            border: none;
            border-radius: 30px;
            width: 90%;
            height: 25%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>

    <div class="contenedor-completo">
        <div class="resultado-escaneo" id="resultado-escaneo">Escaneando...</div>
        <div class="camara-digitador">
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <div class="muestra-numero-escaneado">
            <div class="total" id="total-texto">TOTAL: $0.00</div>
            <button class="capturar-imagen" onclick="capturar()">Capturar Imagen</button>
        </div>
    </div>

<script>
    const video = document.getElementById('webcam');
    const resultadoEscaneo = document.getElementById('resultado-escaneo');
    const totalTexto = document.getElementById('total-texto');
    let ultimoPrecioValido = null;
    let codeReader = null;

    async function iniciarCamara() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert("Tu navegador no soporta el acceso a la camara.");
            return;
        }

        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            video.srcObject = stream;
            await video.play();
            iniciarEscaneo();
        } catch (err) {
            try {
                const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = fallbackStream;
                await video.play();
                iniciarEscaneo();
            } catch (e) {
                alert("No se pudo acceder a la camara. Abre la pagina con HTTPS o localhost.");
            }
        }
    }

    function iniciarEscaneo() {
        codeReader = new ZXing.BrowserMultiFormatReader();
        codeReader.decodeFromVideoElement(video, (result, err) => {
            if (result) {
                const texto = result.getText();
                resultadoEscaneo.textContent = "Detectado: " + texto;
                const precio = parseFloat(texto);
                if (!isNaN(precio) && precio >= 0.00 && precio <= 500.00) {
                    ultimoPrecioValido = precio.toFixed(2);
                    resultadoEscaneo.style.color = "lime";
                    resultadoEscaneo.textContent = "Precio valido: $" + ultimoPrecioValido;
                } else {
                    resultadoEscaneo.style.color = "red";
                    resultadoEscaneo.textContent = "Fuera de rango: " + texto;
                }
            }
        }).catch(err => {
            console.log("Error de escaneo:", err);
        });
    }

    function capturar() {
        if (ultimoPrecioValido !== null) {
            totalTexto.textContent = "TOTAL: $" + ultimoPrecioValido;
            totalTexto.style.color = "green";
        } else {
            totalTexto.textContent = "TOTAL: $0.00";
            resultadoEscaneo.style.color = "yellow";
            resultadoEscaneo.textContent = "No se detecto precio valido (0.00 - 500.00)";
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        iniciarCamara();
    });
</script>
</body>
</html>
