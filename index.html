<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>compras y sumas de precio directo</title>
</head>
<body>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: black;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        .contenedor-completo {
            background:
                radial-gradient(circle at top left, rgb(53, 53, 53) 20%, transparent 60%),
                radial-gradient(circle at top right, rgb(53, 53, 53) 20%, transparent 60%),
                radial-gradient(circle at bottom left, rgba(255,255,255,0.651) 10%, transparent 40%),
                radial-gradient(circle at bottom right, rgba(255,255,255,0.651) 10%, transparent 40%);
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .camara-digitador {
            border: 2px solid white;
            width: 80%;
            height: 30%;
            position: absolute;
            top: 3%;
            left: 10%;
            border-radius: 10px;
            overflow: hidden;
            background: #222;
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #canvas-oculto { display: none; }

        .vista-previa {
            position: absolute;
            top: 34.5%;
            left: 10%;
            width: 80%;
            background: rgba(0,0,0,0.85);
            border: 1px solid lime;
            border-radius: 8px;
            padding: 5px 10px;
            text-align: center;
            z-index: 10;
        }

        .vista-previa .label {
            color: #aaa;
            font-size: 11px;
        }

        .vista-previa .numero-detectado {
            color: lime;
            font-size: 22px;
            font-weight: bold;
            min-height: 28px;
        }

        .resultado-escaneo {
            position: absolute;
            top: 41%;
            left: 10%;
            width: 80%;
            text-align: center;
            color: lime;
            font-size: 12px;
            font-weight: bold;
            text-shadow: 1px 1px 3px black;
            z-index: 10;
        }

        .panel-precios {
            background-color: rgba(255, 255, 255, 0.9);
            border: 2px solid black;
            border-radius: 20px;
            width: 80%;
            position: absolute;
            top: 44%;
            left: 10%;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .lista-precios {
            width: 90%;
            max-height: 100px;
            overflow-y: auto;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            font-size: 13px;
        }

        .item-precio {
            display: flex;
            justify-content: space-between;
            padding: 3px 10px;
            border-bottom: 1px solid #eee;
        }

        .item-precio:last-child { border-bottom: none; }

        .eliminar {
            color: red;
            cursor: pointer;
            font-weight: bold;
            padding: 0 6px;
        }

        .total-box {
            background-color: white;
            border: 2px solid black;
            width: 90%;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            padding: 6px;
        }

        .acciones {
            display: flex;
            gap: 8px;
            width: 90%;
        }

        .capturar-imagen {
            background-color: greenyellow;
            border: none;
            border-radius: 30px;
            flex: 1;
            padding: 10px 0;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .borrar-todo {
            background-color: #ff4444;
            color: white;
            border: none;
            border-radius: 30px;
            flex: 1;
            padding: 10px 0;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>

    <div class="contenedor-completo">
        <div class="camara-digitador">
            <video id="webcam" autoplay playsinline muted></video>
        </div>
        <canvas id="canvas-oculto"></canvas>

        <div class="vista-previa">
            <div class="label">Numero que ve la camara:</div>
            <div class="numero-detectado" id="numero-detectado">Esperando OCR...</div>
        </div>

        <div class="resultado-escaneo" id="resultado-escaneo">Preparando camara...</div>

        <div class="panel-precios">
            <div class="lista-precios" id="lista-precios"></div>
            <div class="total-box" id="total-texto">TOTAL: $0.00</div>
            <div class="acciones">
                <button class="capturar-imagen" onclick="capturar()">Capturar</button>
                <button class="borrar-todo" onclick="borrarTodo()">Borrar todo</button>
            </div>
        </div>
    </div>

    <script src="tesseract.min.js"></script>
    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas-oculto');
        const ctx = canvas.getContext('2d');
        const resultadoEscaneo = document.getElementById('resultado-escaneo');
        const totalTexto = document.getElementById('total-texto');
        const listaPrecios = document.getElementById('lista-precios');
        const numeroDetectado = document.getElementById('numero-detectado');

        let preciosCapturados = [];
        let worker = null;
        let workerListo = false;
        let camaraLista = false;
        let escaneoActivo = false;

        async function iniciarCamara() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                resultadoEscaneo.textContent = "Navegador no compatible";
                resultadoEscaneo.style.color = "red";
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }
                });
                video.srcObject = stream;
                await video.play();
                camaraLista = true;
                resultadoEscaneo.textContent = "Camara lista";
                resultadoEscaneo.style.color = "lime";
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = fallbackStream;
                    await video.play();
                    camaraLista = true;
                    resultadoEscaneo.textContent = "Camara lista";
                    resultadoEscaneo.style.color = "lime";
                } catch (e) {
                    resultadoEscaneo.textContent = "No se pudo acceder a la camara";
                    resultadoEscaneo.style.color = "red";
                }
            }
        }

        async function iniciarWorker() {
            if (worker) return worker;
            worker = await Tesseract.createWorker('eng', 1, {
                workerPath: 'worker.min.js',
                langPath: '.',
                cachePath: '.',
                corePath: 'tesseract.min.js'
            });
            await worker.setParameters({
                tessedit_char_whitelist: '0123456789.'
            });
            workerListo = true;
            numeroDetectado.textContent = "---";
            numeroDetectado.style.color = "#888";
            resultadoEscaneo.textContent = "Camara lista. Apunta al numero y toca Capturar";
            resultadoEscaneo.style.color = "lime";
            return worker;
        }

        function capturarFrame() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas.toDataURL('image/png');
        }

        function extraerNumero(texto) {
            const limpio = texto.replace(/[^0-9.]/g, '');
            const numeros = limpio.match(/\d+\.?\d{0,2}/g);
            if (numeros && numeros.length > 0) {
                for (const num of numeros) {
                    const precio = parseFloat(num);
                    if (precio >= 0.00 && precio <= 500.00) {
                        return precio;
                    }
                }
            }
            return null;
        }

        async function escanearFrame() {
            if (!workerListo || !camaraLista || escaneoActivo) return;
            escaneoActivo = true;
            try {
                const imagen = capturarFrame();
                const { data } = await worker.recognize(imagen);
                const precio = extraerNumero(data.text);
                if (precio !== null) {
                    numeroDetectado.textContent = "$" + precio.toFixed(2);
                    numeroDetectado.style.color = "lime";
                } else {
                    numeroDetectado.textContent = "---";
                    numeroDetectado.style.color = "#888";
                }
            } catch (e) {}
            escaneoActivo = false;
        }

        function iniciarEscaneoContinuo() {
            setInterval(escanearFrame, 2000);
        }

        async function capturar() {
            if (!camaraLista) {
                resultadoEscaneo.textContent = "Espera a que la camara este lista...";
                resultadoEscaneo.style.color = "yellow";
                return;
            }
            if (!workerListo) {
                resultadoEscaneo.textContent = "Cargando OCR, espera...";
                resultadoEscaneo.style.color = "yellow";
                return;
            }

            resultadoEscaneo.textContent = "Leyendo numero...";
            resultadoEscaneo.style.color = "yellow";

            const imagen = capturarFrame();
            const { data } = await worker.recognize(imagen);
            const precio = extraerNumero(data.text);

            if (precio !== null) {
                preciosCapturados.push(precio);
                actualizarLista();
                resultadoEscaneo.textContent = "Agregado: $" + precio.toFixed(2);
                resultadoEscaneo.style.color = "lime";
            } else {
                resultadoEscaneo.textContent = "No se detecto numero valido";
                resultadoEscaneo.style.color = "red";
            }
        }

        function actualizarLista() {
            listaPrecios.innerHTML = "";
            let total = 0;
            preciosCapturados.forEach((precio, i) => {
                total += precio;
                const div = document.createElement("div");
                div.className = "item-precio";
                div.innerHTML = "<span>" + (i + 1) + ". $" + precio.toFixed(2) + "</span><span class='eliminar' onclick='eliminarPrecio(" + i + ")'>X</span>";
                listaPrecios.appendChild(div);
            });
            totalTexto.textContent = "TOTAL: $" + total.toFixed(2);
            listaPrecios.scrollTop = listaPrecios.scrollHeight;
        }

        function eliminarPrecio(index) {
            preciosCapturados.splice(index, 1);
            actualizarLista();
        }

        function borrarTodo() {
            preciosCapturados = [];
            actualizarLista();
            totalTexto.textContent = "TOTAL: $0.00";
            resultadoEscaneo.textContent = "Camara lista. Apunta al numero y toca Capturar";
            resultadoEscaneo.style.color = "lime";
        }

        document.addEventListener('DOMContentLoaded', () => {
            iniciarCamara();
            iniciarWorker();
            setTimeout(iniciarEscaneoContinuo, 3000);
        });
    </script>
</body>
</html>
